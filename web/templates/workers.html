{{template "layout" .}}
{{define "title"}}Workers — Judge0 Cluster{{end}}
{{define "page-title"}}Workers{{end}}

{{define "topbar-actions"}}
<form method="POST" action="/workers/update-all" style="display:inline" onsubmit="return confirm('Start rolling update for all online workers?')">
  <button class="btn btn-secondary btn-sm" style="margin-right:8px">Update All</button>
</form>
<a href="/workers/add" class="btn btn-primary btn-sm">+ Add Worker</a>
{{end}}

{{define "content"}}
<div id="workers-list"
     hx-get="/api/workers"
     hx-trigger="load, every 10s"
     hx-swap="outerHTML">
  {{template "workers-list" .}}
</div>
{{end}}
