{{template "layout" .}}
{{define "title"}}Add Worker — Judge0 Cluster{{end}}
{{define "page-title"}}Add Worker{{end}}

{{define "content"}}
<div class="page-card">
  <div class="section-title">Register New Worker</div>
  {{if .Error}}
  <div class="alert alert-error">{{.Error}}</div>
  {{end}}
  <form method="POST" action="/workers/add">
    <div class="form-group">
      <label class="form-label">Worker Name</label>
      <input class="form-input" type="text" name="name" placeholder="e.g. worker-01" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">IP Address</label>
      <input class="form-input" type="text" name="ip_address" placeholder="192.168.1.100" required>
    </div>
    <div class="form-group">
      <label class="form-label">SSH Username</label>
      <input class="form-input" type="text" name="ssh_username" placeholder="ubuntu" value="ubuntu" required>
    </div>
    <div class="form-group">
      <label class="form-label">SSH Password</label>
      <input class="form-input" type="password" name="ssh_password" placeholder="••••••••" required>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-primary" type="submit">Provision Worker</button>
      <a href="/workers" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{{end}}
