---
- name: Provision Judge0 Worker
  hosts: workers
  become: yes
  gather_facts: yes
  vars:
    agent_install_dir: /opt/worker-agent
    agent_config_dir: /etc/worker-agent
    nomad_version: "1.7.5"
    dashboard_url: "{{ dashboard_url }}"
    worker_uuid: "{{ worker_uuid }}"
    agent_api_key: "{{ agent_api_key }}"
    agent_ports: "{{ agent_ports | default('19090,19091,19092') }}"

  roles:
    - docker
    - nomad_client
    - worker_agent

  post_tasks:
    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Enable and start Nomad
      systemd:
        name: nomad
        enabled: yes
        state: started

    # Must be "restarted", not "started": every provisioning run issues a new
    # API key into config.env, and a already-running agent would keep serving
    # with the old one, failing the health check below with 401.
    - name: Enable and restart Worker Agent
      systemd:
        name: worker-agent
        enabled: yes
        state: restarted

    # The agent binds the first free port in the list, so scan all of them rather
    # than assuming one. Echoes the winning port into the provisioning log.
    - name: Wait for Worker Agent to be healthy
      shell: |
        for p in $(echo "{{ agent_ports }}" | tr ',' ' '); do
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "X-API-Key: {{ agent_api_key }}" \
            "http://localhost:$p/health" 2>/dev/null || true)
          if [ "$code" = "200" ]; then echo "agent healthy on port $p"; exit 0; fi
        done
        exit 1
      register: agent_health
      until: agent_health.rc == 0
      retries: 10
      delay: 3
      changed_when: false
