---
- name: Provision Judge0 Worker
  hosts: workers
  become: yes
  gather_facts: yes
  vars:
    agent_install_dir: /opt/worker-agent
    agent_config_dir: /etc/worker-agent
    nomad_version: "1.7.5"
    dashboard_url: "{{ dashboard_url }}"
    worker_uuid: "{{ worker_uuid }}"
    agent_api_key: "{{ agent_api_key }}"
    agent_ports: "{{ agent_ports | default('19090,19091,19092') }}"
    judge0_dir: /opt/judge0
    # Pinned deliberately: a floating tag lets an unattended pull change the
    # runtime under you. These are the versions Judge0 1.13.1 is tested against.
    judge0_version: "1.13.1"
    judge0_postgres_version: "13.0"
    judge0_redis_version: "6.0"
    judge0_port: 2358

  roles:
    - docker
    - nomad_client
    - worker_agent
    - judge0

  post_tasks:
    # Judge0 takes a while on first boot: it runs database migrations before the
    # API starts answering. Allow noticeably longer than the agent check.
    - name: Wait for Judge0 to be healthy
      uri:
        url: "http://localhost:{{ judge0_port }}/languages"
        headers:
          X-Auth-Token: "{{ agent_api_key }}"
        status_code: 200
      register: judge0_health
      until: judge0_health.status == 200
      retries: 30
      delay: 5
