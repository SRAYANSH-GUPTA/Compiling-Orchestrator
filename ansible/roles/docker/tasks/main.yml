---
# Debian/Ubuntu needs Docker's own apt repository; Arch ships Docker in [extra],
# so the whole keyring-and-repo dance below is Debian-only.
- name: Install Docker on Debian/Ubuntu
  when: ansible_os_family == 'Debian'
  block:
    # Any pre-existing Docker source (a manual install, or an earlier run of this
    # playbook) may declare a different Signed-By for the same repo. apt refuses to
    # read its whole source list when that clashes, so clear them out before doing
    # anything else and let the tasks below define the single source of truth.
    - name: Purge existing Docker apt sources
      shell: |
        grep -rlZ 'download\.docker\.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -0 -r rm -f
        [ -f /etc/apt/sources.list ] && sed -i '/download\.docker\.com/d' /etc/apt/sources.list
        exit 0
      changed_when: true

    - name: Remove old Docker packages
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create apt keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: yes

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: '0644'
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

- name: Install Docker on Arch
  when: ansible_os_family == 'Archlinux'
  pacman:
    name:
      - docker
      - docker-buildx
      - docker-compose
    state: present
    update_cache: yes

- name: Add ansible user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

# Started here rather than in post_tasks so later roles (judge0) can use Docker.
# Debian's package starts it on install; Arch's does not.
- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started
